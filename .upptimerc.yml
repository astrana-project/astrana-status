owner: astrana-project
repo: astrana-status

# Public, user-facing endpoints only. Private hosts (blog preview, CloudPanel, admin pages) are deliberately absent.
sites:
  - name: Website
    url: https://astrana.org
  # - name: Documentation # add when docs.astrana.org is in use
  #   url: https://docs.astrana.org/en/latest/
  - name: Mailing list signup
    url: https://mail-list.astrana.org/forms/nfrm_weLJnLY5
  - name: Analytics tracker
    url: https://wa.astrana.org/matomo.js
  # - name: Blog          # add when blog.astrana.org goes live
  #   url: https://blog.astrana.org

# Outages open an issue assigned to the maintainer, which triggers a GitHub notification email.
assignees:
  - Pckmule

status-website:
  cname: status.astrana.org
  logoUrl: https://astrana.org/logo-512.png
  # Browser-tab icon: the Astrana mark instead of Upptime's default
  favicon: https://astrana.org/favicon.ico
  faviconSvg: https://astrana.org/favicon.svg
  # Matomo, self-hosted at wa.astrana.org (site 5). disableCookies: nothing is stored on the device.
  js: |
    var _paq = (window._paq = window._paq || []);
    _paq.push(['disableCookies']);
    _paq.push(['trackPageView']);
    _paq.push(['enableLinkTracking']);
    (function () {
      var u = 'https://wa.astrana.org/';
      _paq.push(['setTrackerUrl', u + 'matomo.php']);
      _paq.push(['setSiteId', '5']);
      var d = document, g = d.createElement('script'), s = d.getElementsByTagName('script')[0];
      g.async = true; g.src = u + 'matomo.js'; s.parentNode.insertBefore(g, s);
    })();
  name: Astrana status
  introTitle: "Astrana service status"
  introMessage: Live availability of Astrana's public websites, checked every 5 minutes from GitHub. Incidents are tracked openly in this project's [GitHub issues](https://github.com/astrana-project/astrana-status/issues).
  navbar:
    - title: Status
      href: /
    - title: Astrana
      href: https://astrana.org
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
